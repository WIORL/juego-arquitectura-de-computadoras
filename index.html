 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quiz Runner - Arquitectura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
    body { background: #0f172a; font-family: 'Fredoka', cursive, sans-serif; margin: 0; overflow-x: hidden; }
    .body-font { font-family: 'Outfit', sans-serif; }
    .btn-3d-green { background: linear-gradient(180deg, #4ade80 0%, #22c55e 50%, #15803d 100%); box-shadow: 0 4px 0 #14532d; }
    .glass-card { background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(14px); border: 2px solid rgba(255, 255, 255, 0.2); }
    .btn-control {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      box-shadow: 0 4px 0 #1e3a8a;
    }
    .btn-control:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e3a8a;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4 text-white">

  <header class="w-full max-w-4xl flex justify-between items-center bg-slate-900/90 border border-slate-700 p-3 mb-2 rounded-2xl shadow-xl text-sm body-font">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-red-600 border-2 border-white flex items-center justify-center font-black text-lg shadow">M</div>
      <div>
        <div class="text-xs text-yellow-400 font-bold tracking-wide" id="hud-level-title">NIVEL 1</div>
        <div class="text-xs text-slate-400 font-semibold">Modo: Plataformas</div>
      </div>
    </div>
    <div class="flex items-center gap-2 sm:gap-4 text-sm font-bold">
      <div class="flex items-center gap-1 bg-black/40 px-3 py-1.5 rounded-xl border border-red-500/40">
        <span class="text-xs text-red-400 font-bold mr-1">VIDAS:</span>
        <span id="hud-lives" class="text-base tracking-widest text-red-400">❤️❤️❤️❤️</span>
      </div>
      <div class="flex items-center gap-1.5 bg-black/40 px-3 py-1.5 rounded-xl border border-yellow-500/40">
        <span>🪙</span><span id="hud-coins" class="text-yellow-300 font-mono">00</span>
      </div>
      <div class="flex items-center gap-1.5 bg-black/40 px-3 py-1.5 rounded-xl border border-emerald-500/40">
        <span class="text-xs text-emerald-400">PROGRESO</span>
        <span id="hud-progress" class="text-emerald-300 font-mono">0 / 15</span>
      </div>
    </div>
  </header>

  <div class="relative w-full max-w-4xl rounded-3xl overflow-hidden border-2 border-slate-700 shadow-2xl bg-slate-950 flex flex-col items-center">
    <div class="relative w-full aspect-[16/9] max-h-[520px] overflow-hidden bg-sky-400">
      <canvas id="gameCanvas" class="w-full h-full block"></canvas>

      <div id="quizOverlay" class="absolute inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 hidden z-30">
        <div class="w-full max-w-xl glass-card p-5 sm:p-6 rounded-3xl max-h-full overflow-y-auto">
          <div class="flex items-center justify-between pb-3 border-b border-white/10 mb-4">
            <span class="px-2.5 py-1 rounded-full text-xs font-black bg-amber-400 text-black uppercase tracking-wider" id="quizBadgeTopic">TEMA</span>
          </div>
          <h3 id="quizQuestion" class="body-font text-base sm:text-lg text-white font-bold mb-4 leading-snug">¿Pregunta?</h3>
          <div id="quizOptions" class="grid grid-cols-1 gap-2.5 body-font text-sm"></div>
          <div id="quizFeedback" class="mt-3 text-center body-font text-sm font-semibold min-h-[24px]"></div>
        </div>
      </div>

      <div id="messageOverlay" class="absolute inset-0 bg-slate-950/97 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-40">
        <div id="overlayIcon" class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-red-600 to-amber-400 flex items-center justify-center text-4xl shadow-2xl mb-4 border border-white/40 animate-bounce">🎮</div>
        <h1 id="overlayTitle" class="text-2xl sm:text-4xl text-yellow-300 font-black mb-2 uppercase tracking-wide">QUIZ RUNNER</h1>
        <p id="overlaySubtitle" class="body-font text-slate-300 text-sm sm:text-base max-w-md mb-6 leading-relaxed">
          Usa los <b>botones o flechas</b> para moverte y saltar los huecos. ¡Golpea los bloques dorados <b>[?]</b> para responder las preguntas!
        </p>
        <button id="startBtn" class="btn-3d-green text-white font-bold text-base px-8 py-3.5 rounded-2xl active:translate-y-1 transition-transform uppercase tracking-wider">INICIAR JUEGO</button>
      </div>
    </div>

    <!-- CONTROLES DEL JUEGO -->
    <div class="w-full bg-slate-900 px-4 py-3 flex justify-between items-center border-t border-slate-800 body-font select-none">
      <div class="flex gap-3 items-center">
        <button id="btnLeft" class="btn-control w-14 h-12 text-white font-black rounded-2xl text-xl flex items-center justify-center">◀</button>
        <button id="btnRight" class="btn-control w-14 h-12 text-white font-black rounded-2xl text-xl flex items-center justify-center">▶</button>
        <button id="btnJump" class="btn-3d-green px-5 h-12 text-white font-black rounded-2xl text-sm flex items-center justify-center gap-1">
          <span>⬆</span> <span>SALTAR</span>
        </button>
      </div>
      <div class="flex gap-2">
        <button id="btnSound" class="w-12 h-12 bg-slate-800 text-amber-300 border border-slate-600 rounded-2xl flex items-center justify-center text-lg">🔊</button>
      </div>
    </div>
  </div>

  <script>
    const AudioEngine = {
      ctx: null, enabled: true,
      init() { if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; this.ctx = new AC(); } if (this.ctx.state === 'suspended') this.ctx.resume(); },
      tone(freq, dur, type = 'sine', vol = 0.2, delay = 0) {
        if (!this.enabled) return;
        try {
          this.init();
          const start = this.ctx.currentTime + delay;
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = type; o.frequency.setValueAtTime(freq, start);
          g.gain.setValueAtTime(vol, start);
          g.gain.exponentialRampToValueAtTime(0.01, start + dur);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(start); o.stop(start + dur + 0.02);
        } catch(e) {}
      },
      jump() { this.tone(320, 0.15, 'triangle', 0.2); this.tone(540, 0.1, 'triangle', 0.15, 0.05); },
      correct() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'sine', 0.2, i * 0.08)); },
      wrong() { this.tone(320, 0.35, 'sawtooth', 0.25); this.tone(160, 0.4, 'sawtooth', 0.2, 0.15); },
      hit() { this.tone(440, 0.1, 'square', 0.15); },
      levelUp() { [392, 523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.2, 'sine', 0.22, i * 0.1)); }
    };

    const QUESTION_BANK = [
      { id: 1, level: 1, topic: "HIGIENE", q: "¿Cuál NO es una recomendación de higiene en el salón de cómputo?", options: ["No ingerir alimentos en el aula", "No ingresar a sitios web desconocidos", "Mantener limpio el escritorio"], correct: 1, explanation: "Es seguridad, no higiene." },
      { id: 2, level: 1, topic: "MANTENIMIENTO", q: "¿De quién depende el mantenimiento de un salón de cómputo?", options: ["Solo de los usuarios", "Solo de los conserjes", "Trabajo en conjunto de ambos"], correct: 2, explanation: "Ambos comparten responsabilidad." },
      { id: 3, level: 1, topic: "MANTENIMIENTO PROFUNDO", q: "¿Cuál NO es razón para mantenimiento profundo?", options: ["Por estética", "Buena higiene y salud", "Maximizar vida útil"], correct: 0, explanation: "La estética no es técnica." },
      { id: 4, level: 1, topic: "FRECUENCIA", q: "¿Cada cuánto se recomienda mantenimiento profundo?", options: ["Cada 5 años", "Cada 3-6 meses", "Solo si se descompone"], correct: 1, explanation: "Mantenimiento preventivo periódico." },
      { id: 5, level: 1, topic: "BUENAS PRÁCTICAS", q: "¿Qué acción ayuda a la higiene en el laboratorio?", options: ["Comer sobre el teclado", "Lavarse las manos antes y después", "Tocar componentes internos"], correct: 1, explanation: "Reduce gérmenes y polvo." },

      { id: 6, level: 2, topic: "VON NEUMANN", q: "¿Qué es el Modelo de Von Neumann (1945)?", options: ["Un navegador", "Arquitectura fundamental que describe el diseño de una computadora", "Un robot"], correct: 1, explanation: "Base de las computadoras modernas." },
      { id: 7, level: 2, topic: "UNIDAD DE CONTROL", q: "¿Qué contiene la Unidad de Control?", options: ["Registro de instrucciones y contador de programa", "Monitor y teclado", "Datos a largo plazo"], correct: 0, explanation: "Coordina la ejecución." },
      { id: 8, level: 2, topic: "CICLO", q: "Orden correcto del ciclo de instrucción:", options: ["Fetch - Decode - Execute - Store", "Store - Fetch - Execute - Decode", "Execute - Store - Fetch - Decode"], correct: 0, explanation: "Ciclo clásico." },
      { id: 9, level: 2, topic: "CPU", q: "¿Qué componente procesa la información?", options: ["Memoria RAM", "Procesador (CPU)", "Disco duro"], correct: 1, explanation: "La CPU es el cerebro." },
      { id: 10, level: 2, topic: "RAM", q: "¿Qué hace la memoria RAM?", options: ["Almacena temporalmente datos en uso", "Muestra imágenes", "Da energía"], correct: 0, explanation: "Memoria volátil de trabajo." },

      { id: 11, level: 3, topic: "ARQUITECTURA", q: "¿Qué es la arquitectura de una computadora?", options: ["Diseño exterior", "Distribución y organización de componentes y cómo trabajan juntos", "Programas instalados"], correct: 1, explanation: "Organización interna." },
      { id: 12, level: 3, topic: "GENERACIONES", q: "¿Qué caracterizó a la 2da Generación (1956-1963)?", options: ["Tubos al vacío", "Transistores", "Microprocesadores"], correct: 1, explanation: "Reemplazaron a las válvulas." },
      { id: 13, level: 3, topic: "CLASIFICACIÓN", q: "¿Qué usan bancos y aerolíneas para grandes volúmenes?", options: ["Mainframes", "Minicomputadoras", "Microcomputadoras"], correct: 0, explanation: "Alta confiabilidad." },
      { id: 14, level: 3, topic: "PROCESAMIENTO", q: "¿Cómo se clasifican las que procesan bits (0 y 1)?", options: ["Analógicas", "Híbridas", "Digitales"], correct: 2, explanation: "Usan pulsos discretos." },
      { id: 15, level: 3, topic: "1RA GENERACIÓN", q: "¿Qué tecnología usaba la 1ra Generación?", options: ["Tubos al vacío", "Transistores", "Circuitos integrados"], correct: 0, explanation: "1940-1956." }
    ];

    const QUESTIONS_PER_LEVEL = 5;
    const MAX_LEVELS = 3;
    const LEVEL_TITLES = ["NIVEL 1: HIGIENE Y MANTENIMIENTO", "NIVEL 2: VON NEUMANN Y COMPONENTES", "NIVEL 3: ARQUITECTURA Y EVOLUCIÓN"];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const V_WIDTH = 800, V_HEIGHT = 450;
    canvas.width = V_WIDTH;
    canvas.height = V_HEIGHT;
    const GROUND_Y = 370;

    let gameState = 'START';
    let currentLevel = 1;
    let lives = 4;
    let coins = 0;
    let questionsCorrectThisLevel = 0;
    let totalCorrect = 0;
    let cameraX = 0;

    let availableQuestions = []; 
    let currentBlock = null;
    let checkpointX = 80;

    const keys = { left: false, right: false, up: false };

    const player = {
      x: 80, y: GROUND_Y - 48, w: 32, h: 48,
      vx: 0, vy: 0,
      speed: 4, jumpPower: -13, gravity: 0.65,
      onGround: true, facing: 'right', runCycle: 0, falling: false,
      respawn() {
        this.x = checkpointX;
        this.y = GROUND_Y - 48;
        this.vx = 0; this.vy = 0;
        this.onGround = true; this.facing = 'right';
        this.falling = false;
      },
      reset() {
        checkpointX = 80;
        this.respawn();
      }
    };

    let blocks = [];
    let gaps = [];
    let coinsArr = [];

    function getRandomQuestion() {
      if (availableQuestions.length === 0) {
        return QUESTION_BANK.find(q => q.level === currentLevel) || QUESTION_BANK[0];
      }
      const randomIndex = Math.floor(Math.random() * availableQuestions.length);
      const q = availableQuestions[randomIndex];
      availableQuestions.splice(randomIndex, 1);
      return q;
    }

    function buildLevel(lvl) {
      blocks = []; gaps = []; coinsArr = [];
      questionsCorrectThisLevel = 0;
      checkpointX = 80;

      availableQuestions = QUESTION_BANK.filter(q => q.level === lvl);

      const startX = 350;
      const spacing = 360;

      for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
        const blockX = startX + i * spacing;
        const q = getRandomQuestion();

        blocks.push({
          x: blockX,
          y: GROUND_Y - 110,
          w: 44,
          h: 44,
          active: true,
          question: q
        });

        if (i < QUESTIONS_PER_LEVEL - 1) {
          gaps.push({
            x: blockX + 160,
            w: 100
          });
        }
      }

      for (let i = 0; i < 15; i++) {
        coinsArr.push({ x: 220 + i * 130, y: GROUND_Y - 50, taken: false });
      }

      player.reset();
      currentBlock = null;
      cameraX = 0;
      updateHud();
    }

    function updateHud() {
      let hearts = '';
      for (let i = 0; i < 4; i++) hearts += i < lives ? '❤️' : '🖤';
      document.getElementById('hud-lives').innerText = hearts;
      document.getElementById('hud-coins').innerText = String(coins).padStart(2, '0');
      document.getElementById('hud-progress').innerText = `${totalCorrect} / 15`;
      document.getElementById('hud-level-title').innerText = LEVEL_TITLES[currentLevel - 1];
    }

    const quizOverlay = document.getElementById('quizOverlay');
    const quizBadgeTopic = document.getElementById('quizBadgeTopic');
    const quizQuestion = document.getElementById('quizQuestion');
    const quizOptions = document.getElementById('quizOptions');
    const quizFeedback = document.getElementById('quizFeedback');

    function openQuiz(block) {
      if (!block.active) return;

      currentBlock = block;
      gameState = 'QUIZ';
      player.vx = 0;
      AudioEngine.hit();

      const q = block.question;
      quizBadgeTopic.innerText = q.topic;
      quizQuestion.innerText = q.q;
      quizFeedback.innerHTML = ''; quizOptions.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "text-left p-3.5 rounded-2xl border-2 border-slate-700 bg-slate-800 hover:bg-amber-400 hover:text-black hover:border-amber-300 font-semibold transition-all flex items-center gap-3";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-black/40 flex items-center justify-center text-xs font-bold text-amber-300 shrink-0">${String.fromCharCode(65 + idx)}</span><span>${opt}</span>`;
        btn.onclick = () => checkAnswer(idx, q, btn);
        quizOptions.appendChild(btn);
      });
      quizOverlay.classList.remove('hidden');
    }

    function checkAnswer(chosen, q, btn) {
      const allBtns = quizOptions.querySelectorAll('button');
      allBtns.forEach(b => b.disabled = true);
      const block = currentBlock;

      if (chosen === q.correct) {
        btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-400');
        quizFeedback.innerHTML = `<span class="text-emerald-400">✅ ¡CORRECTO!</span><br><span class="text-slate-300 text-xs">${q.explanation}</span>`;
        AudioEngine.correct();
        coins += 5; 
        block.active = false; 
        questionsCorrectThisLevel++; 
        totalCorrect++; 
        
        checkpointX = block.x + block.w + 20;
        updateHud();

        // SI SE COMPLETAN LAS 5 PREGUNTAS DEL NIVEL
        if (questionsCorrectThisLevel >= QUESTIONS_PER_LEVEL) {
          setTimeout(() => {
            quizOverlay.classList.add('hidden');
            if (currentLevel < MAX_LEVELS) {
              showLevelComplete();
            } else {
              triggerVictory();
            }
          }, 1400);
          return;
        }

        setTimeout(() => {
          quizOverlay.classList.add('hidden');
          gameState = 'PLAYING';
        }, 1200);

      } else {
        btn.classList.add('bg-rose-600', 'text-white', 'border-rose-400');
        allBtns[q.correct].classList.add('bg-emerald-600/40', 'border-emerald-400');
        quizFeedback.innerHTML = `<span class="text-rose-400">❌ Incorrecto.</span><br><span class="text-slate-300 text-xs">${q.explanation}<br><b>Pierdes 1 vida. ¡Vuelve a intentarlo!</b></span>`;
        AudioEngine.wrong(); 
        lives--; 
        updateHud();

        setTimeout(() => {
          quizOverlay.classList.add('hidden');
          if (lives <= 0) { triggerGameOver("Te quedaste sin vidas"); return; }
          gameState = 'PLAYING';
        }, 1800);
      }
    }

    // MENSAJE DE PASAR DE NIVEL
    function showLevelComplete() {
      gameState = 'LEVEL_COMPLETE';
      document.getElementById('overlayIcon').innerText = '🎉';
      document.getElementById('overlayIcon').className = "w-20 h-20 rounded-3xl bg-gradient-to-tr from-emerald-500 to-teal-300 flex items-center justify-center text-4xl shadow-2xl mb-4 border border-white/40 animate-bounce";
      document.getElementById('overlayTitle').innerText = `¡NIVEL ${currentLevel} COMPLETADO!`;
      document.getElementById('overlayTitle').className = "text-2xl sm:text-4xl text-emerald-400 font-black mb-2 uppercase tracking-wide";
      document.getElementById('overlaySubtitle').innerHTML = `¡Acertaste las 5 preguntas del nivel!<br><br>Prepárate para pasar al <b>NIVEL ${currentLevel + 1}</b>.`;
      
      const btn = document.getElementById('startBtn');
      btn.innerText = "PASAR AL SIGUIENTE NIVEL ➔";
      btn.onclick = () => {
        currentLevel++;
        buildLevel(currentLevel);
        document.getElementById('messageOverlay').classList.add('hidden');
        gameState = 'PLAYING';
        AudioEngine.levelUp();
      };
      document.getElementById('messageOverlay').classList.remove('hidden');
      AudioEngine.levelUp();
    }

    // MENSAJE FINAL DE VICTORIA CON TROFEO 🏆
    function triggerVictory() {
      gameState = 'VICTORY';
      document.getElementById('overlayIcon').innerText = "🏆";
      document.getElementById('overlayIcon').className = "w-24 h-24 rounded-3xl bg-gradient-to-tr from-yellow-500 via-amber-300 to-yellow-100 flex items-center justify-center text-6xl shadow-2xl mb-4 border-2 border-yellow-200 animate-bounce";
      document.getElementById('overlayTitle').innerText = "¡CAMPEÓN SUPREMO!";
      document.getElementById('overlayTitle').className = "text-3xl sm:text-4xl text-yellow-300 font-black mb-2 uppercase tracking-wide drop-shadow-md";
      document.getElementById('overlaySubtitle').innerHTML = `¡Has llegado al final del juego completando los 3 niveles!<br><br>🪙 Monedas totales: <b>${coins}</b><br>❤️ Vidas restantes: <b>${lives}</b><br>🎯 Aciertos totales: <b>${totalCorrect} / 15</b>`;
      
      const btn = document.getElementById('startBtn');
      btn.innerText = "JUGAR DE NUEVO 🔄";
      btn.onclick = () => startNewGame();
      document.getElementById('messageOverlay').classList.remove('hidden');
      AudioEngine.levelUp();
    }

    function triggerGameOver(msg) {
      gameState = 'GAMEOVER';
      document.getElementById('overlayIcon').innerText = "💀";
      document.getElementById('overlayIcon').className = "w-20 h-20 rounded-3xl bg-gradient-to-tr from-red-600 to-rose-400 flex items-center justify-center text-4xl shadow-2xl mb-4 border border-white/40";
      document.getElementById('overlayTitle').innerText = "FIN DE LA PARTIDA";
      document.getElementById('overlayTitle').className = "text-2xl sm:text-4xl text-rose-500 font-black mb-2 uppercase tracking-wide";
      document.getElementById('overlaySubtitle').innerHTML = `${msg}<br>Nivel ${currentLevel} — ${totalCorrect} aciertos totales`;
      
      const btn = document.getElementById('startBtn');
      btn.innerText = "VOLVER A INTENTAR 🔄";
      btn.onclick = () => startNewGame();
      document.getElementById('messageOverlay').classList.remove('hidden');
    }

    function startNewGame() {
      lives = 4; coins = 0; questionsCorrectThisLevel = 0; totalCorrect = 0; currentLevel = 1;
      buildLevel(currentLevel);
      document.getElementById('messageOverlay').classList.add('hidden');
      quizOverlay.classList.add('hidden');
      gameState = 'PLAYING';
      AudioEngine.init();
    }

    document.getElementById('startBtn').onclick = () => startNewGame();

    function jumpPlayer() {
      if (player.onGround && gameState === 'PLAYING') {
        player.vy = player.jumpPower;
        player.onGround = false;
        AudioEngine.jump();
      }
    }

    const setupBtn = (id, keyName) => {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); keys[keyName] = true; AudioEngine.init(); };
      const end = (e) => { e.preventDefault(); keys[keyName] = false; };
      el.addEventListener('touchstart', start);
      el.addEventListener('touchend', end);
      el.addEventListener('mousedown', start);
      el.addEventListener('mouseup', end);
      el.addEventListener('mouseleave', end);
    };

    setupBtn('btnLeft', 'left');
    setupBtn('btnRight', 'right');

    const btnJumpEl = document.getElementById('btnJump');
    const triggerJump = (e) => { e.preventDefault(); jumpPlayer(); };
    btnJumpEl.addEventListener('touchstart', triggerJump);
    btnJumpEl.addEventListener('mousedown', triggerJump);

    window.addEventListener('keydown', e => {
      AudioEngine.init();
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
      if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && player.onGround) {
        jumpPlayer();
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
    });

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
    }

    function drawMario(p) {
      const px = Math.round(p.x - cameraX);
      const py = Math.round(p.y);
      ctx.save();
      ctx.translate(px, py);

      const walk = p.onGround && Math.abs(p.vx) > 0.1 ? Math.sin(p.runCycle * 0.4) * 3 : 0;
      const isJumping = !p.onGround;

      if (p.facing === 'left') { ctx.translate(p.w, 0); ctx.scale(-1, 1); }

      ctx.fillStyle = '#4a2205';
      if (isJumping) { ctx.fillRect(2, 40, 12, 8); ctx.fillRect(18, 38, 12, 8); }
      else { ctx.fillRect(2 + walk, 42, 13, 8); ctx.fillRect(17 - walk, 42, 13, 8); }

      ctx.fillStyle = '#1e40af';
      if (isJumping) { ctx.fillRect(4, 32, 9, 10); ctx.fillRect(19, 30, 9, 10); }
      else { ctx.fillRect(4, 32, 9, 12); ctx.fillRect(19, 32, 9, 12); }

      ctx.fillStyle = '#1e40af'; ctx.fillRect(5, 22, 22, 12);
      ctx.fillStyle = '#dc2626'; ctx.fillRect(2, 22, 6, 10); ctx.fillRect(24, 22, 6, 10);
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(5, 34, 4, 0, Math.PI * 2); ctx.arc(27, 34, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(9, 25, 2, 0, Math.PI * 2); ctx.arc(23, 25, 2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#451a03'; ctx.fillRect(4, 10, 6, 10);
      ctx.fillStyle = '#fed7aa'; ctx.beginPath(); ctx.arc(16, 14, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.arc(8, 15, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(19, 11, 2.5, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1e3a8a'; ctx.beginPath(); ctx.arc(19.5, 11.5, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1c1917'; ctx.fillRect(16, 6, 5, 1.5);
      ctx.fillStyle = '#fdba74'; ctx.beginPath(); ctx.arc(23, 15, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#1c1917'; ctx.beginPath(); ctx.ellipse(20, 19, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(16, 7, 10, Math.PI, 0); ctx.fill();
      ctx.fillRect(14, 7, 16, 3);
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(16, 4, 4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#dc2626'; ctx.font = 'bold 6px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('M', 16, 4.5);

      ctx.restore();
    }

    function drawGround() {
      let segments = [{ start: -1000, end: 10000 }];

      gaps.forEach(g => {
        let newSegs = [];
        segments.forEach(seg => {
          if (g.x + g.w < seg.start || g.x > seg.end) {
            newSegs.push(seg);
          } else {
            if (seg.start < g.x) newSegs.push({ start: seg.start, end: g.x });
            if (seg.end > g.x + g.w) newSegs.push({ start: g.x + g.w, end: seg.end });
          }
        });
        segments = newSegs;
      });

      segments.forEach(seg => {
        const sx = seg.start - cameraX;
        const sw = seg.end - seg.start;
        if (sw <= 0) return;

        ctx.fillStyle = '#78350f';
        ctx.fillRect(sx, GROUND_Y + 14, sw, V_HEIGHT - GROUND_Y);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(sx, GROUND_Y, sw, 14);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(sx, GROUND_Y, sw, 3);

        ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
        for (let gx = seg.start; gx < seg.end; gx += 60) {
          const drawX = gx - cameraX;
          if (drawX > -60 && drawX < V_WIDTH + 60) {
            ctx.beginPath(); ctx.moveTo(drawX, GROUND_Y + 14); ctx.lineTo(drawX, V_HEIGHT); ctx.stroke();
          }
        }
      });
    }

    function drawClouds() {
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      for (let i = 0; i < 6; i++) {
        const cx = ((i * 250) - cameraX * 0.3) % 1600;
        const cy = 40 + (i * 30) % 130;
        ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI * 2); ctx.arc(cx + 20, cy, 26, 0, Math.PI * 2); ctx.arc(cx + 45, cy, 20, 0, Math.PI * 2); ctx.fill();
      }
    }

    function drawCoin(c) {
      if (c.taken) return;
      const cx = c.x - cameraX;
      const cy = c.y + Math.sin(Date.now() / 300 + c.x) * 3;
      const w = 6 + Math.abs(Math.cos(Date.now() / 200)) * 6;
      ctx.fillStyle = '#fbbf24'; ctx.beginPath(); ctx.ellipse(cx, cy, w, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2; ctx.stroke();
    }

    function drawGoldenBlock(b) {
      if (!b.active) return;
      const bx = b.x - cameraX;
      const by = b.y;

      ctx.fillStyle = '#f59e0b';
      drawRoundedRect(bx, by, b.w, b.h, 8);
      ctx.fill();

      ctx.strokeStyle = '#fef08a';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.fillStyle = '#78350f';
      ctx.font = 'bold 24px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', bx + b.w / 2, by + b.h / 2 + 1);
    }

    function update() {
      if (gameState !== 'PLAYING') return;

      if (keys.left) {
        player.vx = -player.speed;
        player.facing = 'left';
        player.runCycle++;
      } else if (keys.right) {
        player.vx = player.speed;
        player.facing = 'right';
        player.runCycle++;
      } else {
        player.vx = 0;
      }

      player.x += player.vx;
      if (player.x < 10) player.x = 10;

      player.vy += player.gravity;
      player.y += player.vy;

      let overGap = false;
      gaps.forEach(g => {
        if (player.x + player.w > g.x && player.x < g.x + g.w) {
          overGap = true;
        }
      });

      if (!overGap && player.y + player.h >= GROUND_Y) {
        player.y = GROUND_Y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (overGap) {
        player.onGround = false;
      }

      if (player.y > V_HEIGHT) {
        if (!player.falling) {
          player.falling = true;
          lives--;
          updateHud();
          AudioEngine.wrong();
          if (lives <= 0) { 
            triggerGameOver("Caíste al vacío"); 
            return; 
          }
          player.respawn();
          cameraX = Math.max(0, player.x - 200);
        }
      }

      blocks.forEach(b => {
        if (!b.active) return;

        if (
          player.x + player.w > b.x &&
          player.x < b.x + b.w &&
          player.y <= b.y + b.h &&
          player.y + player.h >= b.y &&
          player.vy < 0
        ) {
          player.vy = 2;
          openQuiz(b);
        }
      });

      coinsArr.forEach(c => {
        if (!c.taken && Math.hypot(player.x + 16 - c.x, player.y + 24 - c.y) < 28) {
          c.taken = true; coins++; updateHud(); AudioEngine.tone(880, 0.1, 'sine', 0.15);
        }
      });

      const targetCam = Math.max(0, player.x - V_WIDTH * 0.35);
      cameraX += (targetCam - cameraX) * 0.1;
    }

    function render() {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, V_HEIGHT);
      skyGrad.addColorStop(0, '#0c4a6e'); skyGrad.addColorStop(0.5, '#38bdf8'); skyGrad.addColorStop(1, '#7dd3fc');
      ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, V_WIDTH, V_HEIGHT);

      drawClouds();
      drawGround();
      coinsArr.forEach(drawCoin);
      blocks.forEach(drawGoldenBlock);
      drawMario(player);

      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      drawRoundedRect(10, 10, 220, 42, 10); ctx.fill();
      ctx.fillStyle = '#facc15'; ctx.font = 'bold 15px Fredoka, sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(`✅ Nivel ${currentLevel}/3 — ${questionsCorrectThisLevel}/${QUESTIONS_PER_LEVEL}`, 20, 31);
    }

    function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }

    document.getElementById('btnSound').onclick = () => {
      AudioEngine.enabled = !AudioEngine.enabled;
      document.getElementById('btnSound').innerText = AudioEngine.enabled ? '🔊' : '🔇';
    };

    window.onload = () => { buildLevel(1); updateHud(); gameLoop(); };
  </script>
</body>
